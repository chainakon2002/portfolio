<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dark Glassmorphic Apple Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1d20" />
      <stop offset="50%" stop-color="#111113" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>

    <!-- Subtle Glass Specular Highlights -->
    <linearGradient id="topLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Frosted Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Apple Signature Blue/Cyan Gradient for F -->
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#93c5fd" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glowing Dot Gradient (Matching Film.dev) -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Apple Squircle Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  <rect x="16" y="16" width="480" height="240" rx="116" fill="url(#topLight)" />

  <!-- Bold Architectural Letter F -->
  <path d="M 148 116 C 148 107.16 155.16 100 164 100 L 344 100 C 352.84 100 360 107.16 360 116 L 360 168 C 360 176.84 352.84 184 344 184 L 224 184 L 224 236 L 312 236 C 320.84 236 328 243.16 328 252 L 328 300 C 328 308.84 320.84 316 312 316 L 224 316 L 224 396 C 224 404.84 216.84 412 208 412 L 164 412 C 155.16 412 148 404.84 148 396 Z" fill="url(#fGrad)" filter="url(#glow)" />

  <!-- Apple Dynamic Accent Dot (Film.) -->
  <circle cx="356" cy="386" r="26" fill="url(#dotGrad)" filter="url(#glow)" />
</svg>
